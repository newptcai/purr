[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purr"
dynamic = ["version"]
description = "CLI wrapper for KittenTTS — model management and speech synthesis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8,<3.14"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "typer>=0.12",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    # Unreleased main: drops misaki/spaCy, so no torch/CUDA in the dependency tree.
    "kittentts @ git+https://github.com/KittenML/KittenTTS@be5758500b731b8fc674acc62ea480d3022b7ebe",
    "httpx[socks]>=0.27",  # needed when a SOCKS proxy is configured
]

[project.scripts]
purr = "kitten_cli.cli:app"

[tool.hatch.version]
path = "src/kitten_cli/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kitten_cli"]
